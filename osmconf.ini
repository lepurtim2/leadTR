#
# LeadTR — GDAL OpenStreetMap (OSM) Configuration File
# Optimized for Business / Commercial Entity Extraction in Turkey
#

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no

# Keys to be reported directly as columns
attributes=name,amenity,shop,office,leisure,tourism,craft,healthcare,phone,contact:phone,website,contact:website,email,contact:email,addr:province,addr:city,addr:district,addr:suburb,addr:street,addr:housenumber,opening_hours

# Keys to ignore
ignore=created_by,converted_by,source,time,ele,note,openGeoDB:,fixme,FIXME

# Save all other unlisted tags in other_tags column
other_tags=yes

[lines]
osm_id=yes
attributes=name,highway
ignore=created_by,converted_by,source,time,ele,note,openGeoDB:,fixme,FIXME
other_tags=no

[multipolygons]
osm_id=yes
attributes=name,amenity,shop,office,leisure,tourism,craft,building,addr:province,addr:city,addr:district,phone,website
ignore=created_by,converted_by,source,time,ele,note,openGeoDB:,fixme,FIXME
other_tags=yes

[multilinestrings]
osm_id=yes
attributes=name,type
ignore=created_by,converted_by,source,time,ele,note,openGeoDB:,fixme,FIXME
other_tags=no

[other_relations]
osm_id=yes
attributes=name,type
ignore=created_by,converted_by,source,time,ele,note,openGeoDB:,fixme,FIXME
other_tags=no
